market_research_task:
  description: >
    Analyze the market opportunity for {company_name} ({company_url}).
    Review the company information: {homepage_summary} and internal page details: {internal_pages_text}.
    Assess the external web insights gathered: {market_and_funding_insights}.
    Identify the market sector, estimated TAM, SAM, SOM, maturity stage, key growth drivers, and any regulatory issues.

    Todo tu output (incluyendo key_points, red_flags, y el memo final en prosa) debe estar ÍNTEGRAMENTE en {output_language}. No mezcles idiomas bajo ninguna circunstancia, incluso si las fuentes originales están en otro idioma — traduce la información al idioma solicitado.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (market), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen, un booleano is_clean indicando si no se detectaron problemas relevantes, y una lista de 'sources' (SourceItem) con las URLs específicas y reales que usaste para respaldar tus hallazgos de ESA sección en particular.
    Todo tu output (incluyendo key_points, red_flags, y el memo final en prosa) debe estar ÍNTEGRAMENTE en {output_language}. No mezcles idiomas bajo ninguna circunstancia, incluso si las fuentes originales están en otro idioma — traduce la información al idioma solicitado.
    Cada elemento de key_points debe incluir al menos UNO de los siguientes: un número/estadística concreta, un enlace/URL de referencia, o una acción recomendada específica. Prohibido usar frases genéricas sin sustento como 'la empresa enfrenta riesgos regulatorios' sin especificar CUÁLES riesgos, en qué mercado, o con qué fuente. Si no tienes un dato concreto para un punto, es preferible omitirlo a incluir relleno genérico.
    Para cada fuente en 'sources', incluye: 'url' (la URL específica usada), 'name' (nombre legible, ej 'Sitio oficial de OpenAI') y 'date_accessed' (formato YYYY-MM-DD).
  agent: market_research_specialist

