market_research_task:
  description: >
    Analyze the market opportunity for {company_name} ({company_url}).
    Review the company information: {homepage_summary} and internal page details: {internal_pages_text}.
    Assess the external web insights gathered: {market_and_funding_insights}.
    Identify the market sector, estimated TAM, SAM, SOM, maturity stage, key growth drivers, and any regulatory issues.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (market), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen y un booleano is_clean indicando si no se detectaron problemas relevantes. El reporte final en prosa lo genera otro agente después.
  agent: market_research_specialist

competitive_intelligence_task:
  description: >
    Assess the competitive space for {company_name} ({company_url}).
    Examine competitor insights from search: {competitor_insights}.
    Identify direct and indirect competitors. Outline the startup's unique value proposition, positioning strategy, features compared to industry standard, and possible market entry gaps.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (competition), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen y un booleano is_clean indicando si no se detectaron problemas relevantes. El reporte final en prosa lo genera otro agente después.
  agent: competitive_intelligence_analyst

customer_insights_task:
  description: >
    Evaluate the customer segments, pain points, and acquisition channels for {company_name}.
    Analyze pricing/product reviews and customer feedback trends: {pricing_and_product_insights}.
    Formulate the primary and secondary buyer personas, core user needs solved, customer journey, and strategic growth recommendations.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (customer), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen y un booleano is_clean indicando si no se detectaron problemas relevantes. El reporte final en prosa lo genera otro agente después.
  agent: customer_insights_researcher

product_strategy_task:
  description: >
    Evaluate the product architecture, key features, and development feasibility for {company_name}.
    Use the homepage description: {homepage_summary} and internal pricing/product details: {pricing_and_product_insights}.
    Analyze MVP feature scope, unique technical differentiators, and possible technical risks or scalability challenges.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (product), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen y un booleano is_clean indicando si no se detectaron problemas relevantes. El reporte final en prosa lo genera otro agente después.
  agent: product_strategy_advisor

omission_analyst_task:
  description: >
    Analyze what information is missing from the scraped content of {company_name} ({company_url}).
    Examine the homepage summary: {homepage_summary} and internal page text: {internal_pages_text}.
    Compare these against standard expectations for the startup's industry/stage (e.g. SaaS B2B, fintech, marketplace), identifying missing critical elements like concrete pricing structure, founder bios, business metrics (CAC, LTV, churn), social proof, or licensing/compliance.

    Calculate and analyze the density of vague language/superlatives (e.g. "revolutionary", "game-changing", "market leader", "world-class") compared to the density of concrete figures and metrics.

    {user_priorities_block}
  expected_output: >
    Entrega SOLO los hallazgos clave estructurados en un objeto que contenga la categoría (omissions), un score de 0 a 100, 3-6 bullets cortos (key_points) sin párrafos narrativos extensos, una lista de red_flags si existen y un booleano is_clean indicando si no se detectaron problemas de omisiones relevantes. El reporte final en prosa lo genera otro agente después.
  agent: omission_analyst

business_analyst_task:
  description: >
    Synthesize all prior reports into a professional VC Due Diligence Investment Memo for {company_name}.
    Use the team/founders research insights: {team_and_founders_insights} to evaluate the leadership.

    You will receive the structured AgentFinding outputs from the prior specialist tasks (Market Research, Competitive Intelligence, Customer Insights, Product Strategy, and Omission Analyst).
    Your instruction is: Sintetiza estos hallazgos estructurados en un memo profesional en prosa. Para cada sección (Market, Competition, Team, Product, Financials/Pricing, y Señales por Ausencia), si el hallazgo correspondiente de la sección tiene is_clean=True y red_flags vacío, escribe un párrafo breve (2-4 frases) confirmando que no se detectaron problemas. Si hay red_flags o hallazgos relevantes (is_clean=False o key_points), profundiza esa sección con más detalle en prosa.

    Your report MUST start with exactly three distinct lines at the very top for UI parsing:
    "INVESTMENT_SCORE: [0-100]"
    "RECOMMENDATION: [GO / CONDITIONAL / NO-GO]"
    "SUB_SCORES: {{\"market\": [0-100], \"team\": [0-100], \"product\": [0-100], \"traction\": [0-100], \"risk_legal_omissions\": [0-100]}}"

    Structure the report with:
    - Executive Summary
    - Investment Thesis & Core Strengths
    - Risk Scoring Explanation (explain why the overall score and sub-scores are given, referencing the sub-scores)
    - Deep Dive: Market, Competition, Team, Product, Financials/Pricing
    - Señales por Ausencia (synthesize the Omission Analyst's findings and list of omissions here)
    - Risk Mitigation Framework
    - Final Actionable Recommendation

    {user_priorities_block}
  expected_output: >
    A comprehensive, professional investment memo starting with 'INVESTMENT_SCORE: XX', 'RECOMMENDATION: YY', and 'SUB_SCORES: ZZ' followed by a deep-dive analysis of market, product, competition, team, financials, the 'Señales por Ausencia' section, risk matrix, sub-scores breakdown, and strategic next steps.
  agent: business_analyst

devils_advocate_task:
  description: >
    Critically debate the consensus decision/recommendation made for {company_name} ({company_url}).
    Review the generated investment score, sub-scores, recommendation, and deep-dive analysis from the prior tasks.

    Determine if the recommendation is positive (GO or CONDITIONAL) or negative (NO-GO).
    - If positive (GO or CONDITIONAL): Argue the best possible case AGAINST investing. Focus on critical risks, industry headwinds, missing metrics, team red flags, or potential competitive threats.
    - If negative (NO-GO): Argue the best possible case IN FAVOR of investing. Focus on asymmetric upside, underestimated moats, niche market positioning, or positive signals from public API records.

    You must NOT alter the original score or recommendation. Your analysis must be formatted under a new section titled "Caso a Favor vs. Caso en Contra" (Case For vs. Case Against) or "Análisis Contradictorio" (Contradictory Analysis).

    {user_priorities_block}
  expected_output: >
    A section titled "Caso a Favor vs. Caso en Contra" containing a highly detailed, professional, and convincing debate/contra-argument contesting the consensus recommendation without changing the final score/recommendation.
  agent: devils_advocate
